name: Deploy pairing service

# The public hostname is not in this repository. It arrives as a secret, which
# GitHub also redacts from the logs — including from wrangler's own output.
on:
  push:
    branches: [main]
    paths:
      - "pairing/**"
      - ".github/workflows/deploy-pairing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pairing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The page ships inside a template literal, so the source and what the
      # browser receives are not the same text. This parses the rendered page.
      - name: Check the rendered page
        working-directory: pairing
        run: node ../tests/test_pairing_page.mjs

      # A rate limit binding that is declared on one side only fails silently:
      # env.RL_MISSING is undefined and the code deliberately fails open.
      - name: Check the rate limits
        working-directory: pairing
        run: node ../tests/test_pairing_limits.mjs

      # Pure logic, so it needs no runtime: the mirror's schema, the purity of
      # its op reducer, and the ceilings the session object imports rather than
      # restates.
      - name: Check the mirror schema
        working-directory: pairing
        run: node ../tests/test_mirror_schema.mjs

      # The rules that turn a form into a schema decide what a phone renders and
      # what the relay accepts, and every one of them would otherwise only be
      # observable on a television.
      - name: Check the mirror client
        working-directory: pairing
        run: node ../tests/test_mirror_client.mjs

      # Same template-literal hazard as the setup page: the source and what a
      # browser receives are not the same text.
      - name: Check the rendered mirror page
        working-directory: pairing
        run: node ../tests/test_mirror_page.mjs

      - name: Build the deploy config
        working-directory: pairing
        env:
          PAIR_HOSTNAME: ${{ secrets.PAIR_HOSTNAME }}
        run: node scripts/with-route.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pairing
          # The action defaults to the wrangler 3 line; SQLite-backed Durable
          # Objects and this config were developed and tested against 4.
          wranglerVersion: "4"
          command: deploy --config wrangler.deploy.json
