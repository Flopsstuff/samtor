<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doom</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font:400 22px/1.4 system-ui,-apple-system,Helvetica,sans-serif;color:#e6edf3}
  /* Keep the backing buffer at native DOOM resolution; the compositor scales it.
     The opposite (shader at full screen) cost 32 fps on the previous build. */
  #canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
          image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
  #boot{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
        background:#0d1117;z-index:10}
  #bootbox{max-width:1150px;padding:38px 54px;border:1px solid #30363d;border-radius:16px;background:#121a2a}
  h1{margin:0 0 8px;font-size:44px;color:#ff6b6b}
  .st{color:#8b949e;font-size:22px;margin:6px 0}
  .err{color:#ff6b6b;font-size:20px;white-space:pre-wrap;margin-top:12px;max-height:260px;overflow:hidden}
  .keys{margin-top:20px;color:#7d8590;font-size:19px;line-height:1.7}
  .k{color:#e6edf3;font-weight:600}
  #audio{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);z-index:9;
         background:#1f6feb;color:#fff;padding:14px 30px;border-radius:10px;font-size:24px;display:none}
</style>
</head>
<body>
<canvas id="canvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
<div id="audio">Press any button to enable sound</div>
<div id="boot"><div id="bootbox">
  <h1>Doom</h1>
  <div class="st" id="status">initializing…</div>
  <div class="err" id="err"></div>
  <div class="keys">
    doomgeneric + SDL2_mixer · WAD: DOOM shareware v1.9 (Knee-Deep in the Dead)<br>
    <span class="k">Remote:</span> arrows · <span class="k">Enter</span> fire and menu select ·
    <span class="k">Back</span> menu, double press — exit<br>
    <span class="k">Keyboard:</span> arrows · <span class="k">Ctrl</span> fire ·
    <span class="k">Space</span> use · <span class="k">Shift</span> run ·
    <span class="k">Tab</span> map · <span class="k">Esc</span> menu
  </div>
</div></div>
<script>
(function () {
  "use strict";
  var boot = document.getElementById("boot"),
      statusEl = document.getElementById("status"),
      errEl = document.getElementById("err"),
      audioHint = document.getElementById("audio"),
      cv = document.getElementById("canvas");

  window.__DG__ = { status: "boot", logs: [], errors: [] };
  function status(t) { statusEl.textContent = t; window.__DG__.status = t; }

  // Compute 4:3 ourselves: aspect-ratio is not in Chromium 85 yet.
  function layout() {
    var W = window.innerWidth, H = window.innerHeight, a = 4 / 3;
    var w = W, h = Math.round(W / a);
    if (h > H) { h = H; w = Math.round(H * a); }
    cv.style.width = w + "px"; cv.style.height = h + "px";
  }
  window.addEventListener("resize", layout);
  layout();

  // Web Audio on Chrome starts only after user gesture.
  // On TV, a remote button press counts as that gesture.
  var audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    var ctx = (window.Module && Module.SDL2 && Module.SDL2.audioContext) ||
              (window.SDL2 && SDL2.audioContext);
    if (ctx && ctx.state === "suspended") { ctx.resume(); }
    audioUnlocked = true;
    audioHint.style.display = "none";
    window.__DG__.audioResumed = !!ctx;
    window.__DG__.audioState = ctx ? ctx.state : "no context yet";
  }

  // doomgeneric binds fire to Ctrl, but the remote has no such button.
  // So on Enter we also synthesize Ctrl: in menus the stock Enter still works,
  // in-game it fires. Enter itself remains functional.
  function synth(type, code) {
    var ev = new KeyboardEvent(type, { bubbles: true });
    Object.defineProperty(ev, "keyCode", { get: function () { return code; } });
    Object.defineProperty(ev, "which",   { get: function () { return code; } });
    document.dispatchEvent(ev);
  }
  var ctrlHeld = false;

  var lastBack = 0;
  document.addEventListener("keydown", function (e) {
    unlockAudio();
    if (e.keyCode === 13 && !e.__synth) {          // Enter on remote
      if (!ctrlHeld) { ctrlHeld = true; synth("keydown", 17); }
      return;
    }
    if (e.keyCode === 10009) {                 // Back on remote
      var now = Date.now();
      if (now - lastBack < 700) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} return; }
      lastBack = now;
      // hand Escape to the engine: SDL already listens on document, synthesize the event
      var ev = new KeyboardEvent("keydown", { keyCode: 27, which: 27, bubbles: true });
      Object.defineProperty(ev, "keyCode", { get: function () { return 27; } });
      document.dispatchEvent(ev);
      setTimeout(function () {
        var u = new KeyboardEvent("keyup", { keyCode: 27, which: 27, bubbles: true });
        Object.defineProperty(u, "keyCode", { get: function () { return 27; } });
        document.dispatchEvent(u);
      }, 60);
    }
  }, true);

  document.addEventListener("keyup", function (e) {
    if (e.keyCode === 13 && ctrlHeld) { ctrlHeld = false; synth("keyup", 17); }
  }, true);

  try {
    ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].forEach(function (k) {
      tizen.tvinputdevice.registerKey(k);
    });
  } catch (x) {}

  // ---- emscripten module config ----
  window.Module = {
    canvas: cv,
    arguments: ["-iwad", "doom1.wad"],
    print: function (t) {
      window.__DG__.logs.push(t);
      if (window.__DG__.logs.length > 120) window.__DG__.logs.shift();
      console.log("[dg] " + t);
    },
    printErr: function (t) {
      window.__DG__.errors.push(t);
      if (window.__DG__.errors.length > 60) window.__DG__.errors.shift();
      console.error("[dg!] " + t);
    },
    setStatus: function (t) { if (t) status(t); },
    onRuntimeInitialized: function () {
      window.__DG__.runtimeReady = true;
      status("engine running");
      setTimeout(function () {
        boot.style.display = "none";
        audioHint.style.display = audioUnlocked ? "none" : "block";
        cv.focus();
        layout();
        window.__DG__.canvas = cv.width + "x" + cv.height;
      }, 400);
    },
    onAbort: function (w) {
      window.__DG__.aborted = String(w);
      errEl.textContent = "abort: " + w;
      boot.style.display = "flex";
    }
  };

  window.addEventListener("error", function (e) {
    window.__DG__.pageError = String(e.message);
    errEl.textContent = String(e.message);
  });

  status("loading engine…");
})();
</script>
<script async src="doomgeneric.js"></script>
</body>
</html>
